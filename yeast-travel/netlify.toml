[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://webapi.amap.com https://*.amap.com https://plausible.io; connect-src 'self' https://*.amap.com https://plausible.io; img-src 'self' data: blob: https://*.amap.com; style-src 'self' 'unsafe-inline' https://*.amap.com; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/thanks"
  to = "/thank-you"
  status = 301
